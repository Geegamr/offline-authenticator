[package]
name = "offline-authenticator"
version = "0.1.0"
description = "A local Windows authenticator for one-time passwords and recovery codes."
authors = ["Geegamr"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "offline_authenticator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
aes-gcm = "0.10"
scrypt = "0.11"
constant_time_eq = "0.3"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
parking_lot = "0.12"
qrcode = "0.14"
rqrr = "0.8"
csv = "1"
base32 = "0.5"
sha1 = "0.10"
sha2 = "0.10"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
totp-rs = { version = "5", features = ["otpauth", "zeroize", "gen_secret"] }
url = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi"] }
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
